[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kahunas-client"
version = "0.1.0"
description = "Python client, CLI, and MCP server for the Kahunas fitness API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0",
    "tenacity>=8.2,<10.0",
    "fastmcp>=3.1,<4.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<15.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
lambda = [
    "mangum>=0.17,<1.0",
    "awslambdaric>=3.0,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "pip-audit>=2.7",
]

[project.scripts]
kahunas = "kahunas_client.cli.main:cli"
kahunas-mcp = "kahunas_client.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kahunas_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# matplotlib.dates ships unannotated locator and formatter constructors.
# Exempt calls *into* matplotlib only; strict mode still applies in full to
# every call between our own modules.
untyped_calls_exclude = ["matplotlib"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings (PEP 8)
    "F",    # pyflakes
    "I",    # isort (PEP 8 import ordering)
    "N",    # pep8-naming (PEP 8)
    "D",    # pydocstyle (PEP 257)
    "UP",   # pyupgrade (PEP 585, PEP 604)
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["UP046"]  # Generic[T] subclass is needed for Pydantic models

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "TCH002",
    "TCH003",  # don't require TYPE_CHECKING blocks in tests
    "S101",    # assert is how a test states its expectation
    "S105",
    "S106",    # obviously fake credentials in fixtures
    "D",       # test names and class docstrings carry the intent
]

[tool.ruff.lint.isort]
known-first-party = ["kahunas_client"]
